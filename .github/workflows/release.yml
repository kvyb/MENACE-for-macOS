name: Release CLI

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Confirm no game content is present
        run: ./scripts/check-no-game-content.sh
      - name: Build universal CLI
        run: |
          swift build -c release --arch arm64 --arch x86_64
          mkdir -p dist/MENACE-for-macOS
          cp "$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/menace-macos" dist/MENACE-for-macOS/
          codesign --force --sign - dist/MENACE-for-macOS/menace-macos
          cp README.md LICENSE THIRD_PARTY_NOTICES.md dist/MENACE-for-macOS/
          COPYFILE_DISABLE=1 ditto -c -k --keepParent dist/MENACE-for-macOS MENACE-for-macOS.zip
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: MENACE-for-macOS.zip
          generate_release_notes: true
